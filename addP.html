<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>162·0 — Draft the Perfect Season</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --field:#0c1611;--felt:#132219;--felt2:#1a2e22;--raise:#20362a;
  --line:#2f4a3a;--line2:#243b2e;--chalk:#ece3c8;--dim:#8aa090;--dimmer:#5e756a;
  --amber:#f2b13a;--amber2:#ffcf6b;--glow:rgba(242,177,58,.45);--red:#d0432f;
  --green:#5bbf6a;--greenglow:rgba(91,191,106,.4);--orange:#e8873a;--orangeglow:rgba(232,135,58,.4);
  --shadow:0 18px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:radial-gradient(1100px 520px at 50% -12%,#16281d 0%,transparent 60%),var(--field);
  color:var(--chalk);font-family:'Barlow Semi Condensed',system-ui,sans-serif;font-size:15px;line-height:1.3;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.ic{width:1em;height:1em;vertical-align:-.12em}

/* LANDING */
#landing{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:40;
  background:radial-gradient(900px 500px at 50% 30%,#16281d 0%,var(--field) 70%)}
.marquee{font-family:'Anton';font-size:clamp(84px,20vw,210px);line-height:.82;color:var(--amber);text-shadow:0 0 6px var(--glow),0 0 34px var(--glow),0 6px 0 rgba(0,0,0,.35)}
.marquee .dot{color:var(--chalk)}.marquee .zero{color:var(--red);text-shadow:0 0 6px rgba(208,67,47,.5),0 0 30px rgba(208,67,47,.4)}
.tagline{margin-top:10px;max-width:560px;color:var(--dim);font-size:clamp(15px,2.4vw,19px);text-wrap:balance}.tagline b{color:var(--chalk);font-weight:600}
.bulbs{display:flex;gap:10px;margin:24px 0 4px}
.bulbs i{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--glow);animation:flick 2.4s infinite}
.bulbs i:nth-child(2){animation-delay:.3s}.bulbs i:nth-child(3){animation-delay:.6s}.bulbs i:nth-child(4){animation-delay:.9s}.bulbs i:nth-child(5){animation-delay:1.2s}
@keyframes flick{0%,92%,100%{opacity:1}94%{opacity:.35}96%{opacity:1}}
.btn-start{margin-top:26px;font-family:'Anton';font-size:24px;letter-spacing:.06em;color:#22160a;background:linear-gradient(180deg,var(--amber2),var(--amber));padding:15px 40px;border-radius:6px;box-shadow:0 0 0 3px rgba(0,0,0,.25),0 0 26px var(--glow),var(--shadow);transition:transform .12s,box-shadow .2s}
.btn-start:hover{transform:translateY(-2px)}
.foot{position:absolute;bottom:16px;color:var(--dimmer);font-size:12.5px}

/* SHELL */
#game{display:none;flex-direction:column;height:100dvh;max-width:900px;margin:0 auto;padding:8px 12px 0}
.hdr{display:flex;align-items:center;justify-content:space-between;flex:none;padding-bottom:8px;border-bottom:1px solid var(--line2)}
.logo{font-family:'Anton';font-size:22px;color:#22160a;background:linear-gradient(180deg,var(--amber2),var(--amber));padding:6px 14px;border-radius:8px;letter-spacing:.02em}
.logo span{color:#3a2a0c}
.hicons{display:flex;gap:8px}
.hic{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;color:var(--dim);font-size:17px;display:flex;align-items:center;justify-content:center;background:var(--felt2);transition:.15s}
.hic:hover{color:var(--amber2);border-color:var(--amber)}
.roundline{flex:none;font-family:'Space Mono';font-size:15px;letter-spacing:.24em;color:var(--dim);padding:12px 2px 6px}
.roundline b{color:var(--amber)}

/* BIG ROLL (during spin) */
#rollBig{display:none}
#game.rolling #rollBig{display:flex;flex:1;flex-direction:column;justify-content:center;gap:16px;min-height:0}
.bigpanel{position:relative;border-radius:12px;padding:26px 18px 22px;text-align:center;background:linear-gradient(180deg,#0a130e,#132018);border:2px solid var(--line);box-shadow:inset 0 0 40px rgba(0,0,0,.55)}
.bigpanel .bl{font-family:'Space Mono';font-size:11px;letter-spacing:.34em;color:var(--dim);display:block;margin-bottom:8px}
.bigpanel .bv{font-family:'Anton';text-transform:uppercase;line-height:.95}
.bigpanel.team .bv{font-size:clamp(30px,7vw,54px);color:var(--green);text-shadow:0 0 20px var(--greenglow)}
.bigpanel.decade .bv{font-size:clamp(34px,8vw,58px);color:var(--orange);text-shadow:0 0 20px var(--orangeglow)}
.bigpanel.team{border-color:var(--green);box-shadow:inset 0 0 30px rgba(91,191,106,.08),0 0 22px var(--greenglow)}
.bigpanel.decade{border-color:var(--orange);box-shadow:inset 0 0 30px rgba(232,135,58,.08),0 0 22px var(--orangeglow)}
.bigpanel.spin .bv{filter:blur(3px);opacity:.85}
.bigpanel.spin{border-color:var(--line);box-shadow:inset 0 0 30px rgba(0,0,0,.5)}
.bigpanel.settle{animation:settle .34s ease}
@keyframes settle{0%{transform:scale(1.03)}60%{transform:scale(.995)}100%{transform:scale(1)}}

/* COMPACT ROLL (during pick) */
#rollCompact{display:none}
#game:not(.rolling) #rollCompact{display:flex;align-items:center;gap:8px;flex:none;flex-wrap:wrap}
.pill{font-family:'Anton';font-size:17px;letter-spacing:.03em;padding:7px 15px;border-radius:20px;border:2px solid}
.pill.team{color:var(--green);border-color:var(--green);box-shadow:0 0 12px var(--greenglow)}
.pill.decade{color:var(--orange);border-color:var(--orange);box-shadow:0 0 12px var(--orangeglow)}
.rerolls{display:flex;gap:8px;margin-left:auto}
.rr{display:flex;align-items:center;gap:6px;font-family:'Barlow Semi Condensed';font-weight:600;font-size:13.5px;color:var(--chalk);background:var(--felt2);border:1px solid var(--line);padding:7px 13px;border-radius:20px;transition:.15s}
.rr .ic{color:var(--amber)} .rr:hover:not(:disabled){border-color:var(--amber);color:var(--amber2)} .rr:hover:not(:disabled) .ic{transform:rotate(-40deg);transition:transform .2s}
.rr .k{font-family:'Space Mono';font-size:11px;color:var(--amber)}
.rr:disabled{opacity:.32;cursor:not-allowed}
.rr.rs{border-color:var(--orange)}.rr.rs .ic{color:var(--orange)}.rr.rs:hover:not(:disabled){border-color:var(--orange);color:var(--orange)}
#game.rolling #stageMsg,#game:not(.rolling) #stageMsg{}
.stagemsg{flex:none;font-family:'Space Mono';font-size:12px;color:var(--dim);min-height:0;text-align:center;padding:2px 0}
.stagemsg:empty{display:none}
.stagemsg .bust{color:var(--red)}
.stagemsg .rrl{margin-left:8px;font-family:'Barlow Semi Condensed';font-weight:600;color:var(--amber2);border:1px solid var(--red);border-radius:16px;padding:4px 12px}

/* POOL */
#poolArea{display:none}
#game:not(.rolling) #poolArea{display:flex;flex-direction:column;flex:1;min-height:0;margin-top:10px}
.pool-top{display:flex;align-items:center;gap:6px;flex:none;flex-wrap:wrap}
.tabs{display:flex;gap:5px}
.tab{font-family:'Barlow Semi Condensed';font-weight:600;font-size:12.5px;color:var(--dim);border:1px solid var(--line2);padding:6px 11px;border-radius:16px;transition:.15s}
.tab:hover{color:var(--chalk)}.tab.active{background:var(--amber);color:#22160a;border-color:var(--amber)}
.posbar{display:flex;gap:5px;overflow-x:auto;flex:none;padding:2px 0 8px}
.posbar::-webkit-scrollbar{height:0}
.pchip{flex:none;font-family:'Barlow Semi Condensed';font-weight:700;font-size:13px;letter-spacing:.03em;color:var(--dim);background:transparent;border:1px solid var(--line2);padding:6px 12px;border-radius:8px;transition:.12s}
.pchip:hover:not(:disabled):not(.filled){color:var(--chalk);border-color:var(--dim)}
.pchip.active{background:var(--amber);color:#22160a;border-color:var(--amber)}
.pchip.filled{color:var(--amber2);border-color:var(--amber);box-shadow:inset 0 0 10px var(--glow),0 0 9px var(--glow);cursor:default}
.pchip.filled::after{content:" ✓";font-size:10px}
.search{flex:1;min-width:110px;font-family:'Barlow Semi Condensed';font-size:14px;color:var(--chalk);background:var(--felt);border:1px solid var(--line2);border-radius:18px;padding:7px 14px}
.search::placeholder{color:var(--dimmer)}.search:focus{outline:none;border-color:var(--amber)}
.sortsel{font-family:'Space Mono';font-size:12px;color:var(--amber2);background:var(--felt);border:1px solid var(--line2);border-radius:16px;padding:7px 8px}
.avail{flex:none;font-family:'Space Mono';font-size:10.5px;letter-spacing:.14em;color:var(--dimmer);padding:8px 2px 6px}
.listwrap{flex:1;min-height:0;overflow:auto;border:1px solid var(--line2);border-radius:8px;background:var(--felt)}
.prow{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line2);cursor:pointer;transition:background .1s}
.prow:last-child{border-bottom:none}
.prow:hover{background:rgba(242,177,58,.08)}
.pinfo{flex:1;min-width:0}
.pinfo .nm{font-family:'Barlow Semi Condensed';font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.pinfo .pos{font-family:'Space Mono';font-size:10.5px;color:var(--green);letter-spacing:.04em;margin-top:2px}
.pinfo .pos.dh{color:var(--dimmer)}
.pstats{flex:none;display:flex;gap:7px}
.pstat{display:flex;flex-direction:column;align-items:flex-end;min-width:30px}
.pstat .v{font-family:'Space Mono';font-size:12.5px;color:var(--amber2);line-height:1.05}
.pstat .l{font-family:'Space Mono';font-size:8px;letter-spacing:.04em;color:var(--dimmer);margin-top:1px}
.empty-note{color:var(--dimmer);font-style:italic;padding:22px 14px;text-align:center}

/* TRAY */
.tray{flex:none;border-top:1px solid var(--line);background:linear-gradient(180deg,#0a130e,#101d15);margin:8px -12px 0;padding:0 12px env(safe-area-inset-bottom)}
.tray-toggle{display:flex;align-items:center;gap:9px;font-family:'Space Mono';font-size:11px;letter-spacing:.2em;color:var(--dim);padding:10px 2px;cursor:pointer;user-select:none}
.tray-toggle .car{color:var(--amber);transition:transform .2s}
.tray.open .tray-toggle .car{transform:rotate(90deg)}
.tray-toggle .slots{margin-left:auto;color:var(--dimmer)}
.tray-lineup{display:none;max-height:34vh;overflow:auto;padding-bottom:6px}
.tray.open .tray-lineup{display:block}
.lu{display:flex;align-items:center;gap:9px;padding:5px 4px;border-bottom:1px solid var(--line2)}
.lu .pos{font-family:'Anton';font-size:13px;color:var(--amber);width:26px;flex:none;text-align:center}
.lu.empty .pos{color:var(--dimmer)}
.lu .nm{flex:1;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lu.empty .nm{color:var(--dimmer);font-style:italic;font-weight:500}
.lu .sub{font-family:'Space Mono';font-size:10px;color:var(--dim);flex:none}
.tray-totals{display:flex;gap:0;border-top:1px solid var(--line2);padding:8px 0 10px}
.tt{flex:1;text-align:center;border-right:1px solid var(--line2)}
.tt:last-child{border-right:none}
.tt .v{font-family:'Anton';font-size:clamp(15px,4.2vw,20px);color:var(--chalk);line-height:1;transition:color .35s,text-shadow .35s}
.tt.met .v{color:var(--green);text-shadow:0 0 12px var(--greenglow),0 0 4px var(--greenglow)}
.tt.met .l{color:var(--green)}
.tt.lag .v{color:#c76a58;text-shadow:0 0 8px rgba(140,34,22,.5)}
.tt .l{font-family:'Space Mono';font-size:9px;letter-spacing:.08em;color:var(--dimmer);margin-top:3px;display:block}

/* MODALS */
.veil{position:fixed;inset:0;background:rgba(4,8,6,.82);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.veil.show{display:flex}
.modal{background:var(--felt);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:480px;width:100%;box-shadow:var(--shadow);text-align:center;max-height:86vh;overflow:auto}
.modal h3{font-family:'Anton';font-weight:400;font-size:22px;margin:0 0 4px}
.modal p{color:var(--dim);margin:0 0 14px;font-size:14px}
.modal .lead{text-align:left}
.slot-choices{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.slot-choices button{font-family:'Anton';font-size:18px;color:#22160a;background:var(--amber);padding:11px 18px;border-radius:6px;min-width:56px}
.slot-choices button.dh{background:var(--felt2);color:var(--chalk);border:1px solid var(--line)}
.cancelbtn{margin-top:14px;font-family:'Barlow Semi Condensed';font-weight:600;font-size:14px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:9px 24px}
.cancelbtn:hover{color:var(--chalk);border-color:var(--dim)}
.modal .cline{font-family:'Space Mono';font-size:12px;color:var(--amber2)}.modal .cslash{color:var(--chalk)}
.help-cats{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0 4px}
.help-cats span{font-family:'Space Mono';font-size:12px;color:var(--amber2);border:1px solid var(--line);border-radius:4px;padding:4px 9px}
.endcard{text-align:center}
.end-rec{font-family:'Anton';font-size:clamp(46px,12vw,82px);line-height:.86;color:var(--amber);text-shadow:0 0 30px var(--glow)}
.end-lineup{display:flex;flex-direction:column;gap:1px;margin:10px 0;text-align:left}
.el,.elhead{display:flex;align-items:baseline;gap:8px;padding:4px 2px;border-bottom:1px solid var(--line2)}
.elhead{border-bottom-color:var(--line)}
.el .pos,.elhead .pos{font-family:'Anton';font-size:12px;color:var(--amber);width:22px;flex:none;text-align:center}
.el .who{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.el .who .nm{font-weight:600;font-size:13.5px}
.el .who .tm{font-family:'Space Mono';font-size:10px;color:var(--dim);margin-left:5px}
.elhead .who{flex:1;font-family:'Space Mono';font-size:9.5px;letter-spacing:.12em;color:var(--dimmer)}
.st{flex:none;display:grid;grid-template-columns:24px 24px 28px 24px 38px 44px;text-align:right;font-family:'Space Mono'}
.el .st i{font-size:11px;color:var(--amber2);font-style:normal}
.elhead .st i{font-size:8.5px;color:var(--dimmer);font-style:normal}
.end-rec .l{color:var(--red)}
.end-title{font-family:'Anton';font-size:clamp(24px,5vw,36px);margin:6px 0 2px;color:var(--chalk)}
.end-sub{color:var(--dim);margin:0 0 16px}
.end-cats{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.end-cats span{font-family:'Space Mono';font-size:12px;padding:5px 10px;border-radius:4px;border:1px solid var(--line);color:var(--dim)}
.end-cats span.hit{color:#22160a;background:var(--amber);border-color:var(--amber)}
.end-cats span.hit::before{content:"✓ "}.end-cats span.miss::before{content:"× "}
.btn2{font-family:'Anton';font-size:19px;color:#22160a;background:linear-gradient(180deg,var(--amber2),var(--amber));padding:12px 30px;border-radius:6px;margin-top:6px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="landing">
  <div class="marquee">162<span class="dot">·</span><span class="zero">0</span></div>
  <div class="bulbs"><i></i><i></i><i></i><i></i><i></i></div>
  <p class="tagline">Spin a <b>team</b> and a <b>decade</b>, draft a roster of hitters and pitchers from the best of the '80s, '90s, and 2000s, and chase the only record that matters: <b>162 and 0</b>.</p>
  <button class="btn-start" id="startBtn">Start Season</button>
  <div class="foot">Every stat is a real season, 1980–2009 · Offense only · No pitchers</div>
</div>

<div id="game">
  <div class="hdr">
    <button class="logo" id="logoBtn" title="Home — clears the current draft">162<span>·0</span></button>
    <div class="hicons">
      <button class="hic" id="helpBtn" title="How to play">?</button>
      <button class="hic" id="restartBtn" title="New season"></button>
    </div>
  </div>
  <div class="roundline">ROUND <b id="roundNum">1</b> / 13</div>

  <div id="rollBig">
    <div class="bigpanel team"><span class="bl">TEAM</span><div class="bv" id="bigTeam">—</div></div>
    <div class="bigpanel decade"><span class="bl">DECADE</span><div class="bv" id="bigDec">—</div></div>
  </div>

  <div id="rollCompact">
    <span class="pill team" id="pillTeam">—</span>
    <span class="pill decade" id="pillDec">—</span>
    <div class="rerolls">
      <button class="rr" id="rt"></button>
      <button class="rr" id="rd"></button>
      <button class="rr rs" id="rs"></button>
    </div>
  </div>
  <div class="stagemsg" id="stageMsg"></div>

  <div id="poolArea">
    <div class="posbar" id="posbar"></div>
    <div class="pool-top">
      <input id="search" class="search" placeholder="Search player…" autocomplete="off">
      <select id="sortSel" class="sortsel">
        <option value="ops">OPS</option><option value="avg">AVG</option><option value="HR">HR</option>
        <option value="RBI">RBI</option><option value="R">R</option><option value="SB">SB</option><option value="AB">AB</option>
      </select>
    </div>
    <div class="avail" id="avail"></div>
    <div class="listwrap"><div id="list"></div></div>
  </div>

  <div class="tray" id="tray">
    <div class="tray-toggle" id="trayToggle"><span class="car">▸</span> LINEUP <span class="slots" id="traySlots">0 / 9</span></div>
    <div class="tray-lineup" id="trayLineup"></div>
    <div class="tray-totals" id="trayTotals"></div>
  </div>
</div>

<script>
(function(){
"use strict";
const DATA=JSON.parse(document.getElementById('carddata').textContent);
const COL={}; DATA.cols.forEach((c,i)=>COL[c]=i);
const PCOL={}; DATA.pcols.forEach((c,i)=>PCOL[c]=i);
const ABBR=DATA.abbr||{};
const BENCH={R:891,HR:288,RBI:940,SB:180,AVG:0.315,OPS:0.935};
const SPBENCH={W:15,K:185,ERA:3.33,WHIP:1.23,K9:8.0};
const RPBENCH={SV:30,ERA:2.60,WHIP:1.16,K9:10.5};
const BSLOTS=['C','1B','2B','3B','SS','LF','CF','RF','DH'];
const PSLOTS=['SP1','SP2','RP1','RP2'];
const SLOTS=[...BSLOTS,...PSLOTS];
const ICON='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>';
const ICON2='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>';

// parse batters
const CARDS=DATA.rows.map(r=>{const g=k=>r[COL[k]];
  const AB=g('AB'),H=g('H'),D2=g('2B'),T3=g('3B'),HR=g('HR'),BB=g('BB'),HBP=g('HBP'),SF=g('SF');
  const avg=AB?H/AB:0,obp=(AB+BB+HBP+SF)?(H+BB+HBP)/(AB+BB+HBP+SF):0,slg=AB?(H+D2+2*T3+3*HR)/AB:0;
  return {id:g('id'),name:g('name'),team:g('team'),dec:g('dec'),yr:g('yr'),pos:g('pos')?g('pos').split('|'):[],
    type:'bat',AB,R:g('R'),H,D2,T3,HR,RBI:g('RBI'),BB,SB:g('SB'),HBP,SF,avg,obp,slg,ops:obp+slg};});
// parse pitchers
const PITCHERS=(DATA.pitchers||[]).map(r=>{const g=k=>r[PCOL[k]];
  return {id:g('id'),name:g('name'),team:g('team'),dec:g('dec'),yr:g('yr'),pos:g('pos')?g('pos').split('|'):[],
    type:g('type'),W:g('W'),L:g('L'),SV:g('SV'),IP:g('IP'),H_p:g('H'),ER:g('ER'),BB_p:g('BB'),K:g('K'),
    era:g('ERA'),whip:g('WHIP'),k9:g('K9')};});
const ALL=[...CARDS,...PITCHERS];
const BYTD=new Map();
ALL.forEach(c=>{const k=c.team+'@'+c.dec;(BYTD.get(k)||BYTD.set(k,[]).get(k)).push(c);});
const TEAMS=DATA.teams,DECS=DATA.decades;
const TEAMDECS=new Map(TEAMS.map(t=>[t,DECS.filter(d=>BYTD.has(t+'@'+d))]));
const DECTEAMS=new Map(DECS.map(d=>[d,TEAMS.filter(t=>BYTD.has(t+'@'+d))]));

const SEEN={};
let S;
const TOTAL_ROUNDS=13;
function reset(){S={round:1,roll:null,used:new Set(),roster:Object.fromEntries(SLOTS.map(s=>[s,null])),
  rerolls:{team:1,decade:1,super:1},filter:'All',phase:'landing',sort:'ops',search:'',trayOpen:false,
  teamSeen:{},lastTeam:null};}
reset();
const $=id=>document.getElementById(id);
const decLabel=d=>d+'s';
const abbr=t=>ABBR[t]||t;
const fmt3=x=>(Math.round(x*1000)/1000).toFixed(3).replace(/^0\./,'.');
const fmtEra=x=>x.toFixed(2);
const fmtWhip=x=>x.toFixed(2);
const slotLabel=s=>s.replace(/\d+$/,'');
function newTeam(){return TEAMS[Math.random()*TEAMS.length|0];}
function pickTeam(pool){
  const cap=pool.filter(t=>(S.teamSeen[t]||0)<2);const nr=cap.filter(t=>t!==S.lastTeam);
  const arr=nr.length?nr:(cap.length?cap:pool);
  const w=arr.map(t=>1/((SEEN[t]||0)+1));let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<arr.length;i++){r-=w[i];if(r<=0)return arr[i];}return arr[arr.length-1];}
function openSlots(){return SLOTS.filter(s=>!S.roster[s]);}
function eligibleSlots(card){
  const op=openSlots();
  if(card.type==='bat') return op.filter(s=>BSLOTS.includes(s)&&(s==='DH'||card.pos.includes(s)));
  if(card.type==='SP') return op.filter(s=>s.startsWith('SP')&&card.pos.includes('SP'));
  if(card.type==='RP') return op.filter(s=>s.startsWith('RP')&&card.pos.includes('RP'));
  return [];
}
function poolFor(team,dec){return (BYTD.get(team+'@'+dec)||[]).filter(c=>!S.used.has(c.id)&&eligibleSlots(c).length>0);}
function isPitcherFilter(f){return f==='SP'||f==='RP';}

// rolling
function spinReel(panel,valEl,finalVal,cands,fmt,dur,cb){
  const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduced){valEl.textContent=fmt(finalVal);cb&&cb();return;}
  panel.classList.add('spin');let t=0;clearInterval(panel._tmr);
  panel._tmr=setInterval(()=>{valEl.textContent=fmt(cands[Math.random()*cands.length|0]);t+=80;
    if(t>=dur){clearInterval(panel._tmr);panel.classList.remove('spin');
      valEl.textContent=fmt(finalVal);panel.classList.add('settle');
      setTimeout(()=>panel.classList.remove('settle'),340);cb&&cb();}},80);
}
function pauseThen(cb){setTimeout(cb,matchMedia('(prefers-reduced-motion:reduce)').matches?0:1100);}
function setPhase(p){S.phase=p;$('game').classList.toggle('rolling',p==='rolling');}
function doRoll(){
  const team=pickTeam(TEAMS);const vd=TEAMDECS.get(team);const dec=vd[Math.random()*vd.length|0];
  S.roll={team,dec};setPhase('rolling');setStage('');$('bigDec').textContent='—';
  spinReel($('rollBig').querySelector('.team'),$('bigTeam'),team,TEAMS,x=>x,1150,()=>{
    spinReel($('rollBig').querySelector('.decade'),$('bigDec'),dec,vd,decLabel,950,()=>pauseThen(()=>afterRoll(team,dec)));});
}
function afterRoll(team,dec){if(S.phase!=='rolling')return;S.roll={team,dec};
  setPhase(poolFor(team,dec).length?'pick':'busted');
  S.search='';const _s=$('search');if(_s)_s.value='';
  renderRollCompact();renderControls();renderPool();renderTray();}
function rerollTeam(){if(S.rerolls.team<1||S.phase==='rolling')return;
  const D=S.roll.dec,pool=DECTEAMS.get(D).filter(t=>t!==S.roll.team);if(!pool.length)return;S.rerolls.team--;
  const team=pickTeam(pool);S.roll.team=team;setPhase('rolling');setStage('');$('bigDec').textContent=decLabel(D);
  spinReel($('rollBig').querySelector('.team'),$('bigTeam'),team,pool,x=>x,1000,()=>pauseThen(()=>afterRoll(team,D)));}
function rerollDecade(){if(S.rerolls.decade<1||S.phase==='rolling')return;
  const T=S.roll.team,pool=TEAMDECS.get(T).filter(d=>d!==S.roll.dec);if(!pool.length)return;S.rerolls.decade--;
  const dec=pool[Math.random()*pool.length|0];S.roll.dec=dec;setPhase('rolling');setStage('');$('bigTeam').textContent=T;
  spinReel($('rollBig').querySelector('.decade'),$('bigDec'),dec,pool,decLabel,1000,()=>pauseThen(()=>afterRoll(T,dec)));}
function superRoll(){if(S.rerolls.super<1||S.phase==='rolling')return;S.rerolls.super--;doRoll();}

function draft(card){chooseSlot(card,eligibleSlots(card));}
function place(card,slot){S.roster[slot]=card;S.used.add(card.id);
  S.teamSeen[S.roll.team]=(S.teamSeen[S.roll.team]||0)+1;S.lastTeam=S.roll.team;SEEN[S.roll.team]=(SEEN[S.roll.team]||0)+1;
  const filled=SLOTS.every(s=>S.roster[s]);renderTray();
  if(filled){endSeason();return;}S.round++;renderTop();doRoll();}

// scoring
function batTotals(){let o={R:0,HR:0,RBI:0,SB:0},H=0,AB=0,D2=0,T3=0,HRr=0,BB=0,HBP=0,SF=0,n=0;
  BSLOTS.forEach(s=>{const c=S.roster[s];if(!c)return;n++;o.R+=c.R;o.HR+=c.HR;o.RBI+=c.RBI;o.SB+=c.SB;
    H+=c.H;AB+=c.AB;D2+=c.D2;T3+=c.T3;HRr+=c.HR;BB+=c.BB;HBP+=c.HBP;SF+=c.SF;});
  const avg=AB?H/AB:0,obp=(AB+BB+HBP+SF)?(H+BB+HBP)/(AB+BB+HBP+SF):0,slg=AB?(H+D2+2*T3+3*HRr)/AB:0;
  return {R:o.R,HR:o.HR,RBI:o.RBI,SB:o.SB,AVG:avg,OPS:obp+slg,n};}
function pitchAvg(slots,benchObj){
  const arms=slots.map(s=>S.roster[s]).filter(Boolean);
  if(!arms.length) return {vals:{},met:false,n:0};
  const avg=k=>arms.reduce((a,c)=>a+c[k],0)/arms.length;
  const v={W:avg('W'),K:avg('K'),SV:avg('SV'),ERA:avg('era'),WHIP:avg('whip'),K9:avg('k9')};
  const allMet=Object.entries(benchObj).every(([k,b])=>(k==='ERA'||k==='WHIP')?v[k]<=b:v[k]>=b);
  return {vals:v,met:allMet,n:arms.length};}
const CATS=[['R','R'],['HR','HR'],['RBI','RBI'],['SB','SB'],['AVG','AVG'],['OPS','OPS']];
function batMetCount(t){return CATS.filter(([k])=>t[k]>=BENCH[k]).length;}
function winsFor(batMet,spMet,rpMet){
  let m=batMet;
  if(m>=5&&spMet&&rpMet) m=6; // Model B: pitching buys back one batting miss
  if(m===6) return 162; if(m>=5) return 160; return 60+20*m;}

// render
function setStage(html){$('stageMsg').innerHTML=html;}
function renderTop(){$('roundNum').textContent=S.round;}
function renderRollCompact(){$('pillTeam').textContent=abbr(S.roll.team);$('pillTeam').title=S.roll.team;
  $('pillDec').textContent=decLabel(S.roll.dec);}
function renderControls(){
  const rt=$('rt'),rd=$('rd'),rs=$('rs');
  rt.innerHTML=`${ICON} Team <span class="k">${S.rerolls.team}</span>`;
  rd.innerHTML=`${ICON} Decade <span class="k">${S.rerolls.decade}</span>`;
  rs.innerHTML=`${ICON2} Super <span class="k">${S.rerolls.super}</span>`;
  const oneDecade=(TEAMDECS.get(S.roll.team)||[]).length<2;
  rt.disabled=S.rerolls.team<1;rd.disabled=S.rerolls.decade<1||oneDecade;rs.disabled=S.rerolls.super<1;
  rd.title=oneDecade?'This team only played in one decade':'';rs.title='Reroll team AND decade';
  rt.onclick=rerollTeam;rd.onclick=rerollDecade;rs.onclick=superRoll;
  if(S.phase==='busted'){setStage(`<span class="bust">No eligible players — ${abbr(S.roll.team)} · ${decLabel(S.roll.dec)}.</span><button class="rrl" id="respinBtn">Spin again — free</button>`);
    $('respinBtn').onclick=doRoll;} else setStage('');
}
function inCat(c,cat){
  if(cat==='All') return true;
  if(cat==='SP') return c.pos.includes('SP');
  if(cat==='RP') return c.pos.includes('RP');
  return eligibleSlots(c).includes(cat);
}
function renderPosBar(){
  if(S.filter!=='All'){const f=S.filter;
    if(BSLOTS.includes(f)&&S.roster[f]) S.filter='All';
    if(f==='SP'&&S.roster.SP1&&S.roster.SP2) S.filter='All';
    if(f==='RP'&&S.roster.RP1&&S.roster.RP2) S.filter='All';}
  const chips=['All',...BSLOTS,'SP','RP'];
  $('posbar').innerHTML=chips.map(c=>{
    if(c==='All')return `<button class="pchip ${S.filter==='All'?'active':''}" data-p="All">All</button>`;
    let filled,active=S.filter===c;
    if(c==='SP') filled=!!(S.roster.SP1&&S.roster.SP2);
    else if(c==='RP') filled=!!(S.roster.RP1&&S.roster.RP2);
    else filled=!!S.roster[c];
    return `<button class="pchip ${filled?'filled':''} ${active?'active':''}" data-p="${c}"${filled?' disabled':''}>${c}</button>`;
  }).join('');
  $('posbar').querySelectorAll('.pchip:not([disabled])').forEach(b=>b.onclick=()=>{
    S.filter=b.dataset.p;S.sort=isPitcherFilter(b.dataset.p)?'era':'ops';updateSortSel();renderPosBar();renderList();});
}
function updateSortSel(){
  const sel=$('sortSel');const pf=isPitcherFilter(S.filter);
  const bOpts=[['ops','OPS'],['avg','AVG'],['HR','HR'],['RBI','RBI'],['R','R'],['SB','SB'],['AB','AB']];
  const pOpts=[['era','ERA ↑'],['W','W'],['K','K'],['SV','SV'],['k9','K/9'],['whip','WHIP ↑']];
  const opts=pf?pOpts:bOpts;
  sel.innerHTML=opts.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
  if(!opts.find(([v])=>v===S.sort))S.sort=opts[0][0];
  sel.value=S.sort;
}
const ASC_KEYS=new Set(['era','whip']);
function renderList(){
  if(S.phase!=='pick'){$('list').innerHTML='';$('avail').textContent='';return;}
  let pool=poolFor(S.roll.team,S.roll.dec).filter(c=>inCat(c,S.filter));
  if(S.search){const q=S.search.toLowerCase();pool=pool.filter(c=>c.name.toLowerCase().includes(q));}
  const k=S.sort;const asc=ASC_KEYS.has(k);
  pool.sort((a,b)=>{const va=a[k]??999,vb=b[k]??999;return asc?va-vb:vb-va;});
  $('avail').textContent=`${pool.length} PLAYERS AVAILABLE`;
  if(!pool.length){$('list').innerHTML=`<div class="empty-note">No players fit an open slot from this roll — try another tab, search, or reroll.</div>`;return;}
  const stat=(v,l)=>`<div class="pstat"><span class="v">${v}</span><span class="l">${l}</span></div>`;
  $('list').innerHTML=pool.map((c,i)=>{
    const pos=c.pos.length?`<div class="pos">${c.pos.join(' · ')}</div>`:`<div class="pos dh">DH only</div>`;
    let stats;
    if(c.type==='SP') stats=`${stat(c.W,'W')}${stat(c.K,'K')}${stat(fmtEra(c.era),'ERA')}${stat(fmtWhip(c.whip),'WHIP')}${stat(c.k9.toFixed(1),'K/9')}`;
    else if(c.type==='RP') stats=`${stat(c.SV,'SV')}${stat(fmtEra(c.era),'ERA')}${stat(fmtWhip(c.whip),'WHIP')}${stat(c.k9.toFixed(1),'K/9')}`;
    else stats=`${stat(c.R,'R')}${stat(c.HR,'HR')}${stat(c.RBI,'RBI')}${stat(c.SB,'SB')}${stat(fmt3(c.avg),'AVG')}${stat(fmt3(c.ops),'OPS')}`;
    return `<div class="prow" data-i="${i}"><div class="pinfo"><div class="nm">${c.name}</div>${pos}</div><div class="pstats">${stats}</div></div>`;}).join('');
  $('list').querySelectorAll('.prow').forEach(el=>el.onclick=()=>draft(pool[+el.dataset.i]));
}
function renderPool(){renderPosBar();updateSortSel();renderList();}
function renderTray(){
  const bt=batTotals();const sp=pitchAvg(['SP1','SP2'],SPBENCH);const rp=pitchAvg(['RP1','RP2'],RPBENCH);
  const filled=SLOTS.filter(s=>S.roster[s]).length;
  $('traySlots').textContent=`${filled} / ${TOTAL_ROUNDS}`;
  $('trayLineup').innerHTML=SLOTS.map(s=>{const c=S.roster[s];const dl=slotLabel(s);
    if(!c)return `<div class="lu empty"><span class="pos">${dl}</span><span class="nm">open</span></div>`;
    let sub;
    if(c.type==='bat') sub=`${abbr(c.team)} '${String(c.yr).slice(2)} · ${c.HR}/${c.RBI}/${c.SB} ${fmt3(c.avg)}`;
    else if(c.type==='SP') sub=`${abbr(c.team)} '${String(c.yr).slice(2)} · ${c.W}W ${c.K}K ${fmtEra(c.era)}`;
    else sub=`${abbr(c.team)} '${String(c.yr).slice(2)} · ${c.SV}SV ${fmtEra(c.era)} ${c.k9.toFixed(1)}K/9`;
    return `<div class="lu"><span class="pos">${dl}</span><span class="nm">${c.name}</span><span class="sub">${sub}</span></div>`;}).join('');
  // batting totals bar with glow
  const v=k=>{if(!bt.n)return'—';return (k==='AVG'||k==='OPS')?fmt3(bt[k]):Math.floor(bt[k]/bt.n);};
  const onPace=k=>{if(!bt.n)return null;const pv=(k==='AVG'||k==='OPS')?bt[k]:bt[k]/bt.n,pb=(k==='AVG'||k==='OPS')?BENCH[k]:BENCH[k]/9;return pv>=pb;};
  $('trayTotals').innerHTML=CATS.map(([k,l])=>{const p=onPace(k);const cls=p===null?'':(p?'met':'lag');
    return `<div class="tt ${cls}"><div class="v">${v(k)}</div><span class="l">${l}</span></div>`;}).join('');
  $('tray').classList.toggle('open',S.trayOpen);
}
function chooseSlot(card,opts){const m=$('modal');
  let sl;
  if(card.type==='bat') sl=`<span class="cslash">${fmt3(card.avg)}/${fmt3(card.obp)}/${fmt3(card.slg)}</span> · ${card.HR} HR · ${card.RBI} RBI · ${card.SB} SB · ${card.R} R`;
  else if(card.type==='SP') sl=`${card.W}W · ${card.K}K · ${fmtEra(card.era)} ERA · ${fmtWhip(card.whip)} WHIP · ${card.k9.toFixed(1)} K/9`;
  else sl=`${card.SV}SV · ${fmtEra(card.era)} ERA · ${fmtWhip(card.whip)} WHIP · ${card.k9.toFixed(1)} K/9`;
  const dispSlots=opts.map(s=>slotLabel(s));
  m.innerHTML=`<h3>${card.name}</h3>
   <p>${card.yr} ${card.team} · ${card.pos.join('/')}<br><span class="cline">${sl}</span></p>
   <p style="margin-bottom:10px">Add to your roster at:</p>
   <div class="slot-choices">${opts.map((s,i)=>`<button data-s="${s}">${dispSlots[i]}</button>`).join('')}</div>
   <div><button class="cancelbtn" data-cancel>Cancel</button></div>`;
  m.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{$('veil').classList.remove('show');place(card,b.dataset.s);});
  m.querySelector('[data-cancel]').onclick=()=>$('veil').classList.remove('show');
  $('veil').classList.add('show');}
function showHelp(){$('modal').innerHTML=`<h3>How to play</h3>
  <div class="lead"><p>Each of the ${TOTAL_ROUNDS} rounds spins a <b style="color:var(--green)">team</b> and a <b style="color:var(--orange)">decade</b>. Draft players into your roster — 9 position players (C, 1B, 2B, 3B, SS, LF, CF, RF, DH) plus 2 starting pitchers and 2 relievers.</p>
  <p>You have three lifelines: reroll the team, the decade, or both (once each).</p>
  <p>Your team is judged on six batting categories — targets are hidden. An elite pitching staff can cover one batting shortfall.</p></div>
  <div class="help-cats"><span>R</span><span>HR</span><span>RBI</span><span>SB</span><span>AVG</span><span>OPS</span><span>SP</span><span>RP</span></div>
  <button class="btn2" id="closeHelp">Got it</button>`;
  $('closeHelp').onclick=()=>$('veil').classList.remove('show');$('veil').classList.add('show');}
function endSeason(){S.phase='done';
  const bt=batTotals(),bm=batMetCount(bt);
  const sp=pitchAvg(['SP1','SP2'],SPBENCH),rp=pitchAvg(['RP1','RP2'],RPBENCH);
  const w=winsFor(bm,sp.met,rp.met);
  const titles={6:'PERFECT SEASON',5:'PENNANT WINNERS',4:'PLAYOFF BOUND',3:'WINNING SEASON',2:'PLAYING .500',1:'REBUILDING YEAR',0:'CELLAR DWELLERS'};
  const finalM=w===162?6:(w>=160?5:Math.floor((w-60)/20));
  // batting lineup
  const bhead=`<div class="elhead"><span class="pos"></span><span class="who">PLAYER · TEAM</span><span class="st"><i>R</i><i>HR</i><i>RBI</i><i>SB</i><i>AVG</i><i>OPS</i></span></div>`;
  const blines=BSLOTS.map(s=>{const c=S.roster[s];return `<div class="el"><span class="pos">${s}</span><span class="who"><b class="nm">${c.name}</b><span class="tm">${abbr(c.team)} '${String(c.yr).slice(2)}</span></span><span class="st"><i>${c.R}</i><i>${c.HR}</i><i>${c.RBI}</i><i>${c.SB}</i><i>${fmt3(c.avg)}</i><i>${fmt3(c.ops)}</i></span></div>`;}).join('');
  // pitching lineup
  const phead=`<div class="elhead"><span class="pos"></span><span class="who">PITCHER · TEAM</span><span class="st"><i>W</i><i>SV</i><i>K</i><i>ERA</i><i>WHIP</i><i>K/9</i></span></div>`;
  const plines=PSLOTS.map(s=>{const c=S.roster[s];const dl=slotLabel(s);return `<div class="el"><span class="pos">${dl}</span><span class="who"><b class="nm">${c.name}</b><span class="tm">${abbr(c.team)} '${String(c.yr).slice(2)}</span></span><span class="st"><i>${c.W}</i><i>${c.SV}</i><i>${c.K}</i><i>${fmtEra(c.era)}</i><i>${fmtWhip(c.whip)}</i><i>${c.k9.toFixed(1)}</i></span></div>`;}).join('');
  // category tags
  const bcats=CATS.map(([k,l])=>{const hit=bt[k]>=BENCH[k];const val=(k==='AVG'||k==='OPS')?fmt3(bt[k]):Math.floor(bt[k]/bt.n);return `<span class="${hit?'hit':'miss'}">${l} ${val}</span>`;}).join('');
  const sptag=`<span class="${sp.met?'hit':'miss'}">SP${sp.met?' ✓':''}</span>`;
  const rptag=`<span class="${rp.met?'hit':'miss'}">RP${rp.met?' ✓':''}</span>`;
  const redeemed=bm>=5&&bm<6&&sp.met&&rp.met;
  let subtext=`${bm} of 6 batting benchmarks cleared.`;
  if(redeemed) subtext+=` Elite pitching covered the gap — the perfect season.`;
  else if(w===162) subtext+=` The perfect season.`;
  else if(sp.met&&rp.met&&bm<5) subtext+=` Pitching was elite, but needed 5/6 batting to redeem.`;
  $('modal').innerHTML=`<div class="endcard"><div class="end-rec">${w}<span class="l">–${162-w}</span></div>
    <div class="end-title">${titles[finalM]||'REBUILDING YEAR'}</div><p class="end-sub">${subtext}</p>
    <div class="end-lineup">${bhead}${blines}</div>
    <div class="end-lineup" style="margin-top:6px">${phead}${plines}</div>
    <div class="end-cats">${bcats}${sptag}${rptag}</div>
    <button class="btn2" id="againBtn">New Season</button></div>`;
  $('veil').classList.add('show');$('againBtn').onclick=()=>{$('veil').classList.remove('show');startGame();};}

function confirmRestart(){if(SLOTS.every(s=>!S.roster[s])){startGame();return;}
  $('modal').innerHTML=`<h3>New season?</h3><p>Your current roster will be cleared.</p>
   <div class="slot-choices"><button data-a="y">New Season</button><button class="dh" data-a="n">Cancel</button></div>`;
  $('modal').querySelector('[data-a=y]').onclick=()=>{$('veil').classList.remove('show');startGame();};
  $('modal').querySelector('[data-a=n]').onclick=()=>$('veil').classList.remove('show');
  $('veil').classList.add('show');}
function goHome(){$('veil').classList.remove('show');reset();$('game').style.display='none';$('landing').style.display='flex';}
function startGame(){reset();$('landing').style.display='none';$('game').style.display='flex';
  $('restartBtn').innerHTML=ICON;
  $('helpBtn').onclick=showHelp;$('restartBtn').onclick=confirmRestart;$('logoBtn').onclick=goHome;
  $('trayToggle').onclick=()=>{S.trayOpen=!S.trayOpen;renderTray();};
  $('search').value='';$('search').oninput=e=>{S.search=e.target.value;renderList();};
  $('sortSel').value=S.sort;$('sortSel').onchange=e=>{S.sort=e.target.value;renderList();};
  renderTop();renderTray();renderPosBar();doRoll();}
$('startBtn').onclick=startGame;
})();
</script>
